{% extends "base.html" %}
{% block content %}
<section class="section narrow">
<h1>{{'Sửa truyện' if m else 'Thêm truyện'}}</h1>
<form method="post" enctype="multipart/form-data" class="adminform">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Tên truyện<input name="title" required value="{{m.title if m else ''}}"></label>
  <label>Slug URL<input name="slug" required placeholder="vi-du-ten-truyen" value="{{m.slug if m else ''}}"></label>
  <label>Tên khác<input name="alt_title" value="{{m.alt_title if m else ''}}"></label>
  <label>Tác giả<input name="author" value="{{m.author if m else ''}}"></label>
  <label>Họa sĩ<input name="artist" value="{{m.artist if m else ''}}"></label>
  <label>Thể loại<input name="genres" placeholder="Hành động,Phiêu lưu" value="{{m.genres if m else ''}}"></label>
  <label>Trạng thái<select name="status"><option {%if m and m.status=='Đang tiến hành'%}selected{%endif%}>Đang tiến hành</option><option {%if m and m.status=='Hoàn thành'%}selected{%endif%}>Hoàn thành</option></select></label>
  <label>Mô tả<textarea name="description">{{m.description if m else ''}}</textarea></label>
  <label>Ảnh bìa<input type="file" name="cover" accept="image/*"></label>
  <label class="check"><input type="checkbox" name="featured" {%if m and m.featured%}checked{%endif%}> Truyện nổi bật</label>
  <button>Lưu</button>
</form>
</section>
{% endblock %}
