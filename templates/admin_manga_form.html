{% extends "base.html" %}{% block title %}{{'Sửa' if m else 'Thêm'}} truyện — Admin{% endblock %}{% block content %}<div class="formbox" style="width:min(760px,calc(100% - 28px))"><h1>{{'Sửa truyện' if m else 'Thêm truyện'}}</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><label>Tên truyện</label><input name="title" required value="{{m.title if m else ''}}"></div><div class="field"><label>Slug (vd: one-piece)</label><input name="slug" required value="{{m.slug if m else ''}}"></div><div class="field"><label>Tên khác</label><input name="alt_title" value="{{m.alt_title if m else ''}}"></div><div class="field"><label>Tác giả</label><input name="author" value="{{m.author if m else ''}}"></div><div class="field"><label>Họa sĩ</label><input name="artist" value="{{m.artist if m else ''}}"></div><div class="field"><label>Thể loại (ngăn cách bằng dấu phẩy)</label><input name="genres" value="{{m.genres if m else ''}}"></div><div class="field"><label>Trạng thái</label><select name="status"><option>Đang tiến hành</option><option>Hoàn thành</option><option>Tạm ngưng</option></select></div><div class="field"><label>Mô tả</label><textarea name="description">{{m.description if m else ''}}</textarea></div><div class="field"><label>Ảnh bìa</label><input type="file" name="cover" accept="image/*"></div><label><input type="checkbox" name="featured" {% if m and m.featured %}checked{% endif %}> Truyện nổi bật</label><div class="actions"><button class="btn primary">Lưu truyện</button><a class="btn" href="{{url_for('admin')}}">Hủy</a></div></form></div>{% endblock %}
