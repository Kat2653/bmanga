{% extends "base.html" %}{% block title %}Thêm chương — Admin{% endblock %}{% block content %}<div class="formbox" style="width:min(760px,calc(100% - 28px))"><h1>Thêm chương</h1><p class="muted">{{m.title}}</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><label>Số chương</label><input type="number" step="0.1" name="number" required></div><div class="field"><label>Tiêu đề</label><input name="title"></div><div class="field"><label>Upload ảnh trang (chọn nhiều ảnh)</label><input type="file" name="pages" accept="image/*" multiple></div><div class="field"><label>Hoặc URL ảnh — mỗi dòng 1 URL</label><textarea name="page_urls"></textarea></div><button class="btn primary">Đăng chương</button></form></div>{% endblock %}
