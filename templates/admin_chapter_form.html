{% extends "base.html" %}
{% block content %}
<section class="section narrow">
<h1>Thêm chương — {{m.title}}</h1>
<form method="post" enctype="multipart/form-data" class="adminform">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Số chương<input type="number" step="0.1" name="number" required></label>
  <label>Tiêu đề<input name="title"></label>
  <label>Upload nhiều ảnh<input type="file" name="pages" accept="image/*" multiple></label>
  <label>Hoặc URL ảnh, mỗi dòng một URL<textarea name="page_urls" rows="10"></textarea></label>
  <button>Đăng chương</button>
</form>
</section>
{% endblock %}
