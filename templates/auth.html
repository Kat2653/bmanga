{% extends "base.html" %}{% block content %}<main class="auth"><h1>{{'Đăng ký' if mode=='register' else 'Đăng nhập'}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if mode=='register' %}<label>Tên hiển thị<input name="display_name"></label>{% endif %}<label>Tài khoản<input name="username" required autocomplete="username"></label><label>Mật khẩu<input type="password" name="password" required></label>{% if mode=='register' %}<label>Nhập lại mật khẩu<input type="password" name="confirm" required></label>{% endif %}<button class="btn primary">{{'Tạo tài khoản' if mode=='register' else 'Đăng nhập'}}</button></form></main>{% endblock %}
