{% extends "base.html" %}{% block content %}<div class="auth"><div class="logo">B<span>MANGA</span></div><h1>{{'Tạo tài khoản' if mode=='register' else 'Đăng nhập'}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username<input name="username" required></label><label>Mật khẩu<input type="password" name="password" required></label><button class="btn primary">{{'Đăng ký' if mode=='register' else 'Đăng nhập'}}</button></form>{% if mode=='login' %}<p>Chưa có tài khoản? <a href="{{url_for('register')}}">Đăng ký</a></p>{% endif %}</div>{% endblock %}
