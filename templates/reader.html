<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{c.manga_title}} - Chương {{'%g'|format(c.number)}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="reader-body">
<div class="readerbar"><div class="container"><a href="{{url_for('manga_detail',slug=c.slug)}}">← {{c.manga_title}}</a><b>Ch. {{'%g'|format(c.number)}}</b><span>{% if prevc %}<a class="pill" href="{{url_for('read_chapter',chapter_id=prevc.id)}}">←</a>{% endif %} {% if nextc %}<a class="pill" href="{{url_for('read_chapter',chapter_id=nextc.id)}}">→</a>{% endif %}</span></div></div>
<div class="pages">{% for p in pages %}<img loading="lazy" src="{{p}}" alt="Trang {{loop.index}}">{% else %}<div class="formbox">Chương này chưa có ảnh.</div>{% endfor %}</div>
<div class="reader-nav">{% if prevc %}<a class="btn" href="{{url_for('read_chapter',chapter_id=prevc.id)}}">← Chương trước</a>{% endif %}<a class="btn" href="{{url_for('manga_detail',slug=c.slug)}}">Danh sách chương</a>{% if nextc %}<a class="btn primary" href="{{url_for('read_chapter',chapter_id=nextc.id)}}">Chương sau →</a>{% endif %}</div></body></html>
