<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{c.manga.title}} - Ch. {{'%g'|format(c.number)}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="reader-body">
<div class="reader-top"><a href="{{url_for('manga_detail',slug=c.manga.slug)}}">← {{c.manga.title}}</a><select onchange="location=this.value">{% for x in all_chapters %}<option value="{{url_for('read_chapter',chapter_id=x.id)}}" {%if x.id==c.id%}selected{%endif%}>Ch. {{'%g'|format(x.number)}}</option>{% endfor %}</select><div class="reader-tools"><button onclick="setReader('vertical')">Dọc</button><button onclick="setReader('single')">1 trang</button><button onclick="toggleFull()">⛶</button></div></div>
<div id="reader" class="reader vertical">{% for p in pages %}<img data-index="{{loop.index0}}" loading="{{'eager' if loop.index<3 else 'lazy'}}" src="{{p}}" alt="Trang {{loop.index}}">{% else %}<div class="empty">Chương chưa có ảnh.</div>{% endfor %}</div>
<div class="reader-nav">{% if prevc %}<a class="btn" href="{{url_for('read_chapter',chapter_id=prevc.id)}}">← Chương trước</a>{% endif %}<a class="btn" href="{{url_for('manga_detail',slug=c.manga.slug)}}">Danh sách chương</a>{% if nextc %}<a class="btn primary" href="{{url_for('read_chapter',chapter_id=nextc.id)}}">Chương sau →</a>{% endif %}</div>
<form class="reader-report" method="post" action="{{url_for('report')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="manga_id" value="{{c.manga_id}}"><input type="hidden" name="chapter_id" value="{{c.id}}"><input type="hidden" name="reason" value="Lỗi chương"><button>Báo lỗi chương</button></form>
<script>window.BMANGA_CHAPTER={{c.id}};window.BMANGA_CSRF="{{csrf_token()}}";</script><script src="{{url_for('static',filename='js/reader.js')}}"></script></body></html>
