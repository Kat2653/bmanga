{% extends "admin/_base.html" %}{% block admin_content %}<h1>{{'Sửa truyện' if m else 'Thêm truyện'}}</h1><form class="adminform" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tên truyện<input name="title" required value="{{m.title if m else ''}}"></label><label>Slug<input name="slug" required value="{{m.slug if m else ''}}"></label><label>Tên khác<input name="alt_title" value="{{m.alt_title if m else ''}}"></label><label>Tác giả<input name="author" value="{{m.author if m else ''}}"></label><label>Họa sĩ<input name="artist" value="{{m.artist if m else ''}}"></label><label>Loại<select name="type">{% for t in ['Manga','Manhwa','Manhua'] %}<option {%if m and m.type==t%}selected{%endif%}>{{t}}</option>{% endfor %}</select></label><label>Thể loại<input name="genres" placeholder="Hành động,Phiêu lưu" value="{{m.genres if m else ''}}"></label><label>Trạng thái<select name="status">{% for s in ['Đang tiến hành','Hoàn thành','Tạm ngưng'] %}<option {%if m and m.status==s%}selected{%endif%}>{{s}}</option>{% endfor %}</select></label><label>Mô tả<textarea name="description">{{m.description if m else ''}}</textarea></label><label>Ảnh bìa<input type="file" name="cover" accept="image/*"></label><label><input type="checkbox" name="featured" {%if m and m.featured%}checked{%endif%}> Nổi bật</label><label><input type="checkbox" name="mature" {%if m and m.mature%}checked{%endif%}> Nội dung 18+</label><button class="btn primary">Lưu</button></form>{% endblock %}
