{% extends "admin/_base.html" %}{% block admin_content %}<h1>{{'Sửa truyện' if m else 'Thêm truyện'}}</h1><form class="adminform" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tên truyện<input name="title" value="{{m.title if m else ''}}" required></label><label>Slug (để trống sẽ tự tạo)<input name="slug" value="{{m.slug if m else ''}}"></label><label>Tên khác<input name="alt_title" value="{{m.alt_title if m else ''}}"></label><div class="form2"><label>Tác giả<input name="author" value="{{m.author if m else ''}}"></label><label>Họa sĩ<input name="artist" value="{{m.artist if m else ''}}"></label></div><label>Thể loại, cách nhau dấu phẩy<input name="genres" value="{{m.genres if m else ''}}" placeholder="Comedy,Romance,School Life"></label><div class="form3"><label>Loại<select name="type">{% for x in ['Manga','Manhwa','Manhua'] %}<option {% if m and m.type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Trạng thái<select name="status">{% for x in ['Đang tiến hành','Hoàn thành','Tạm ngưng'] %}<option {% if m and m.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Nhóm<select name="team_id"><option value="">Không có</option>{% for t in teams %}<option value="{{t.id}}" {% if m and m.team_id==t.id %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select></label></div><label>Mô tả<textarea name="description">{{m.description if m else ''}}</textarea></label><div class="form2"><label>Upload ảnh bìa<input type="file" name="cover" accept="image/*"></label><label>Hoặc URL ảnh<input name="cover_url" placeholder="https://..."></label></div><label class="check"><input type="checkbox" name="featured" {% if m and m.featured %}checked{% endif %}> Truyện nổi bật / Hot</label><label class="check"><input type="checkbox" name="mature" {% if m and m.mature %}checked{% endif %}> Nội dung 18+</label><button class="btn primary">Lưu truyện</button></form>{% endblock %}
