{% extends "admin/_base.html" %}{% block admin_content %}<h1>Banner trang chủ</h1><form class="adminform" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tiêu đề<input name="title" required></label><label>Mô tả<input name="subtitle"></label><div class="form2"><label>Upload ảnh<input type="file" name="image_file" accept="image/*"></label><label>Hoặc URL ảnh<input name="image"></label></div><label>Link đích<input name="link"></label><label>Thứ tự<input type="number" name="sort_order" value="0"></label><label class="check"><input type="checkbox" name="active" checked> Hiển thị</label><button class="btn primary">Thêm banner</button></form>{% for b in rows %}<div class="ranking-line"><b>{{b.title}}</b><span>{{b.subtitle}}</span><form method="post" action="{{url_for('admin_banner_delete',bid=b.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn danger">Xóa</button></form></div>{% endfor %}{% endblock %}
