{% extends "admin/_base.html" %}{% block admin_content %}<h1>Banner trang chủ</h1><form class="adminform" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tiêu đề<input name="title" required></label><label>Phụ đề<input name="subtitle"></label><label>URL ảnh<input name="image"></label><label>Link<input name="link"></label><label>Thứ tự<input type="number" name="sort_order" value="0"></label><label><input type="checkbox" name="active" checked> Kích hoạt</label><button class="btn primary">Thêm banner</button></form><div class="chapters">{% for b in rows %}<div class="row"><b>{{b.title}}</b><span>{{'Bật' if b.active else 'Tắt'}}</span><form method="post" action="{{url_for('admin_banner_delete',bid=b.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="linkbtn">Xóa</button></form></div>{% endfor %}</div>{% endblock %}
