{% extends "admin/_base.html" %}{% block admin_content %}<h1>Cài đặt website</h1><form class="adminform" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tên website<input name="site_name" value="{{settings.site_name}}"></label><label>Mô tả<input name="site_description" value="{{settings.site_description}}"></label><label>Thông báo đầu trang<input name="announcement" value="{{settings.announcement}}"></label><label>Cho phép đăng ký<select name="allow_register"><option value="1" {%if settings.allow_register=='1'%}selected{%endif%}>Có</option><option value="0" {%if settings.allow_register=='0'%}selected{%endif%}>Không</option></select></label><button class="btn primary">Lưu cài đặt</button></form>{% endblock %}
