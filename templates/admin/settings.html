{% extends "admin/_base.html" %}{% block admin_content %}<h1>Cài đặt website</h1><form class="adminform" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tên website<input name="site_name" value="{{settings.site_name}}"></label><label>Mô tả SEO<input name="site_description" value="{{settings.site_description}}"></label><label>Thông báo<textarea name="announcement">{{settings.announcement}}</textarea></label><label>Footer<input name="footer_text" value="{{settings.footer_text}}"></label><label>Facebook<input name="facebook_url" value="{{settings.facebook_url}}"></label><label>Discord<input name="discord_url" value="{{settings.discord_url}}"></label><label>Telegram<input name="telegram_url" value="{{settings.telegram_url}}"></label><label class="check"><input type="checkbox" name="allow_register" value="1" {% if settings.allow_register=='1' %}checked{% endif %}> Cho đăng ký tài khoản</label><button class="btn primary">Lưu cài đặt</button></form>{% endblock %}
