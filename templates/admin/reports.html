{% extends "admin/_base.html" %}{% block admin_content %}<h1>Báo lỗi</h1><div class="table"><table><tr><th>ID</th><th>Nội dung</th><th>Truyện/chương</th><th>Trạng thái</th></tr>{% for r in rows %}<tr><td>#{{r.id}}</td><td><b>{{r.reason}}</b><br>{{r.details}}</td><td>{{r.manga.title if r.manga else '-'}}{% if r.chapter %} / Ch. {{'%g'|format(r.chapter.number)}}{% endif %}</td><td><form method="post" action="{{url_for('admin_report_status',rid=r.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="status"><option {% if r.status=='open' %}selected{% endif %}>open</option><option {% if r.status=='doing' %}selected{% endif %}>doing</option><option {% if r.status=='closed' %}selected{% endif %}>closed</option></select><button class="btn">Lưu</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
