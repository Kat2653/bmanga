{% extends "admin/_base.html" %}{% block admin_content %}<div class="shelf-title"><h1>Quản lý truyện</h1><div><a class="btn" href="{{url_for('admin_import_series')}}">📦 Import cả bộ</a> <a class="btn primary" href="{{url_for('admin_manga_new')}}">+ Thêm truyện</a></div></div><form class="admin-search"><input name="q" value="{{q}}" placeholder="Tìm truyện"><button class="btn">Tìm</button></form><div class="table"><table><tr><th>ID</th><th>Tên</th><th>Loại</th><th>Trạng thái</th><th>View</th><th>Thao tác</th></tr>{% for m in rows %}<tr><td>{{m.id}}</td><td>{{m.title}}</td><td>{{m.type}}</td><td>{{m.status}}</td><td>{{m.views}}</td><td><a class="btn" href="{{url_for('admin_chapters',mid=m.id)}}">Chương</a> <a class="btn" href="{{url_for('admin_manga_edit',mid=m.id)}}">Sửa</a>{% if me.role=='admin' %} <form class="inline" method="post" action="{{url_for('admin_manga_delete',mid=m.id)}}" onsubmit="return confirm('Xóa truyện và toàn bộ chương?')"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn danger">Xóa</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
