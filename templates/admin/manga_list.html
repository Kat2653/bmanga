{% extends "admin/_base.html" %}{% block admin_content %}<div class="section-title"><h1>Quản lý truyện</h1><a class="btn primary" href="{{url_for('admin_manga_new')}}">+ Thêm</a></div><div class="table"><table><tr><th>ID</th><th>Truyện</th><th>Loại</th><th>Trạng thái</th><th>Views</th><th>Thao tác</th></tr>{% for m in rows %}<tr><td>{{m.id}}</td><td>{{m.title}}</td><td>{{m.type}}</td><td>{{m.status}}</td><td>{{m.views}}</td><td><a class="chip" href="{{url_for('admin_manga_edit',mid=m.id)}}">Sửa</a> <a class="chip" href="{{url_for('admin_chapters',mid=m.id)}}">Chương</a>{% if me.role=='admin' %}<form class="inline" method="post" action="{{url_for('admin_manga_delete',mid=m.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="linkbtn" onclick="return confirm('Xóa truyện?')">Xóa</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
