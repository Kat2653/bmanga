{% extends "admin/_base.html" %}{% block admin_content %}<h1>Dashboard</h1><div class="stats">{% for k,v in stats.items() %}<div><small>{{k}}</small><b>{{v}}</b></div>{% endfor %}</div><h2>Truyện cập nhật gần đây</h2>{% for m in recent %}<div class="ranking-line"><a href="{{url_for('admin_manga_edit',mid=m.id)}}">{{m.title}}</a><a href="{{url_for('admin_chapters',mid=m.id)}}">Quản lý chương</a><span>{{m.updated_at.strftime('%d/%m %H:%M')}}</span></div>{% endfor %}{% endblock %}
