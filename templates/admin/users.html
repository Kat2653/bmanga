{% extends "admin/_base.html" %}{% block admin_content %}<h1>Thành viên</h1><form class="admin-search"><input name="q" value="{{q}}" placeholder="Tìm user"><button class="btn">Tìm</button></form><div class="table"><table><tr><th>User</th><th>Role</th><th>Điểm</th><th>VIP</th><th>Hoạt động</th><th>Lưu</th></tr>{% for u in rows %}<tr><form method="post" action="{{url_for('admin_user_update',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><td>{{u.username}}<br><small>{{u.display_name}}</small></td><td><select name="role">{% for x in ['user','editor','admin'] %}<option {% if u.role==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></td><td><input class="smallinput" type="number" name="points" value="{{u.points}}"></td><td><input type="checkbox" name="vip" {% if u.vip %}checked{% endif %}></td><td><input type="checkbox" name="is_active" {% if u.is_active %}checked{% endif %}></td><td><button class="btn">Lưu</button></td></form></tr>{% endfor %}</table></div>{% endblock %}
