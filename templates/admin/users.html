{% extends "admin/_base.html" %}{% block admin_content %}<h1>Người dùng</h1><div class="table"><table><tr><th>ID</th><th>User</th><th>Role</th><th>Điểm</th><th>VIP</th><th>Hoạt động</th><th></th></tr>{% for u in rows %}<tr><form method="post" action="{{url_for('admin_user_update',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><td>{{u.id}}</td><td>{{u.username}}</td><td><select name="role"><option {%if u.role=='user'%}selected{%endif%}>user</option><option {%if u.role=='editor'%}selected{%endif%}>editor</option><option {%if u.role=='admin'%}selected{%endif%}>admin</option></select></td><td><input class="smallinput" name="points" type="number" value="{{u.points}}"></td><td><input type="checkbox" name="vip" {%if u.vip%}checked{%endif%}></td><td><input type="checkbox" name="is_active" {%if u.is_active%}checked{%endif%}></td><td><button class="chip">Lưu</button></td></form></tr>{% endfor %}</table></div>{% endblock %}
