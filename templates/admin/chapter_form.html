{% extends "admin/_base.html" %}{% block admin_content %}<h1>{{'Sửa' if c else 'Thêm'}} chương — {{m.title}}</h1><form class="adminform" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="form2"><label>Số chương<input type="number" step="0.01" name="number" value="{{c.number if c else ''}}" required></label><label>Tiêu đề<input name="title" value="{{c.title if c else ''}}"></label></div><label>Upload nhiều ảnh<input type="file" name="pages" accept="image/*" multiple></label><label>URL ảnh — mỗi dòng 1 URL<textarea name="page_urls">{{pages|join('
')}}</textarea></label>{% if c %}<label class="check"><input type="checkbox" name="replace_urls" value="1"> Thay toàn bộ danh sách ảnh hiện tại bằng phần URL ở trên + file mới</label>{% endif %}<label class="check"><input type="checkbox" name="is_published" value="1" {% if not c or c.is_published %}checked{% endif %}> Công khai chương</label><button class="btn primary">Lưu chương</button></form>{% endblock %}
