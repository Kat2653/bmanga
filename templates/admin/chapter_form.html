{% extends "admin/_base.html" %}{% block admin_content %}<h1>{{'Sửa chương' if c else 'Thêm chương'}} — {{m.title}}</h1><form class="adminform" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Số chương<input type="number" step="0.1" name="number" required value="{{c.number if c else ''}}"></label><label>Tiêu đề<input name="title" value="{{c.title if c else ''}}"></label><label>Upload nhiều ảnh<input type="file" name="pages" accept="image/*" multiple></label><label>URL ảnh, mỗi dòng 1 URL<textarea name="page_urls">{% if c %}{{(c.pages_json|default('[]'))}}{% endif %}</textarea></label><label><input type="checkbox" name="is_published" value="1" {%if not c or c.is_published%}checked{%endif%}> Xuất bản</label><button class="btn primary">Lưu chương</button></form>{% endblock %}
