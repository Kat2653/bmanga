{% extends "admin/_base.html" %}{% block admin_content %}<h1>Bình luận</h1>{% for c in rows %}<article class="admin-comment"><b>{{c.user.username}}</b> · <a href="{{url_for('manga_detail',slug=c.manga.slug)}}">{{c.manga.title}}</a><p>{{c.body}}</p><form class="inline" method="post" action="{{url_for('admin_comment_toggle',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn">{{'Hiện' if c.hidden else 'Ẩn'}}</button></form>{% if me.role=='admin' %}<form class="inline" method="post" action="{{url_for('admin_comment_delete',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn danger">Xóa</button></form>{% endif %}</article>{% endfor %}{% endblock %}
