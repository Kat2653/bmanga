{% extends "admin/_base.html" %}{% block admin_content %}<h1>Bình luận</h1><div class="table"><table><tr><th>User</th><th>Truyện</th><th>Nội dung</th><th>Ẩn</th><th></th></tr>{% for c in rows %}<tr><td>{{c.user.username}}</td><td>{{c.manga.title}}</td><td>{{c.body}}</td><td>{{'Có' if c.hidden else 'Không'}}</td><td><form class="inline" method="post" action="{{url_for('admin_comment_toggle',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="chip">{{'Hiện' if c.hidden else 'Ẩn'}}</button></form>{% if me.role=='admin' %}<form class="inline" method="post" action="{{url_for('admin_comment_delete',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="linkbtn">Xóa</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
