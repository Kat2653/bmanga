{% extends "admin/_base.html" %}{% block admin_content %}<div class="section-title"><h1>Chương — {{m.title}}</h1><a class="btn primary" href="{{url_for('admin_chapter_new',mid=m.id)}}">+ Thêm chương</a></div><div class="table"><table><tr><th>Chương</th><th>Tiêu đề</th><th>Views</th><th>Xuất bản</th><th>Thao tác</th></tr>{% for c in rows %}<tr><td>{{'%g'|format(c.number)}}</td><td>{{c.title}}</td><td>{{c.views}}</td><td>{{'Có' if c.is_published else 'Nháp'}}</td><td><a class="chip" href="{{url_for('admin_chapter_edit',cid=c.id)}}">Sửa</a><form class="inline" method="post" action="{{url_for('admin_chapter_delete',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="linkbtn" onclick="return confirm('Xóa chương?')">Xóa</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
