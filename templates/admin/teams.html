{% extends "admin/_base.html" %}{% block admin_content %}<h1>Nhóm dịch</h1><form class="adminform" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tên nhóm<input name="name" required></label><label>Slug<input name="slug"></label><label>Mô tả<textarea name="description"></textarea></label><button class="btn primary">Thêm nhóm</button></form>{% for t in rows %}<div class="ranking-line"><a href="{{url_for('team_detail',slug=t.slug)}}">{{t.name}}</a><span>{{t.description}}</span><form method="post" action="{{url_for('admin_team_delete',tid=t.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn danger">Xóa</button></form></div>{% endfor %}{% endblock %}
